<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weekly Pocket - 週間予算＆お小遣い管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            num: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-active {
      background-color: #0f172a;
      color: #ffffff;
    }
    .tab-inactive {
      background-color: transparent;
      color: #64748b;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80">
    <div class="max-w-md mx-auto px-4 pt-3 pb-2">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-emerald-500 flex items-center justify-center text-white shadow-sm">
            <i data-lucide="wallet" class="w-4 h-4"></i>
          </div>
          <div>
            <h1 class="text-base font-bold tracking-tight text-slate-900 leading-none">Weekly Pocket</h1>
            <p id="currentWeekRange" class="text-[11px] text-slate-500 font-medium mt-0.5">今週の予算管理</p>
          </div>
        </div>
        <button type="button" onclick="openBudgetModal()" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center gap-1">
          <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
          予算設定
        </button>
      </div>

      <!-- タブ切り替え -->
      <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl">
        <button type="button" id="tabBtnHome" onclick="switchTab('home')" class="tab-active py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          <i data-lucide="pie-chart" class="w-3.5 h-3.5"></i>
          今週の予算
        </button>
        <button type="button" id="tabBtnHistory" onclick="switchTab('history')" class="tab-inactive py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          <i data-lucide="history" class="w-3.5 h-3.5"></i>
          これまでの履歴
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- ==================== タブ1：今週の予算 ==================== -->
    <div id="viewHome" class="space-y-4">

      <!-- 残金メインカード -->
      <div id="balanceCard" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 transition-colors">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold text-slate-500">今週の残り予算</span>
          <span id="statusBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">
            順調ペース
          </span>
        </div>

        <div class="flex items-baseline gap-1 my-1">
          <span class="text-lg font-bold text-slate-400">¥</span>
          <span id="remainingAmount" class="text-4xl font-extrabold font-num tracking-tight text-slate-900">0</span>
        </div>

        <!-- プログレスバー -->
        <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden my-3">
          <div id="progressBar" class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width: 100%"></div>
        </div>

        <!-- サブ指標（予算・使用済み・1日あたり） -->
        <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-center">
          <div>
            <p class="text-[10px] font-bold text-slate-400">設定予算</p>
            <p id="displayBudget" class="text-xs font-bold font-num text-slate-700 mt-0.5">¥0</p>
          </div>
          <div class="border-x border-slate-100">
            <p class="text-[10px] font-bold text-slate-400">使った合計</p>
            <p id="displaySpent" class="text-xs font-bold font-num text-slate-700 mt-0.5">¥0</p>
          </div>
          <div>
            <p class="text-[10px] font-bold text-slate-400">1日あたり目安</p>
            <p id="displayDaily" class="text-xs font-bold font-num text-emerald-600 mt-0.5">¥0</p>
          </div>
        </div>
      </div>

      <!-- クイック支出登録フォーム -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-500"></i>
            使った金額を登録
          </h2>

          <!-- 日付指定コントロール（デフォルトは今日） -->
          <div class="flex items-center gap-1.5">
            <span id="customDateBadge" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">
              日付指定中
            </span>
            <div class="relative flex items-center">
              <input type="date" id="expenseDate" onchange="onExpenseDateChange()"
                class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 border border-slate-200/80 rounded-lg text-[11px] font-bold font-num text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
            </div>
            <button type="button" id="resetTodayBtn" onclick="resetExpenseDateToToday()" class="hidden text-[10px] font-bold text-emerald-600 hover:text-emerald-700 underline">
              今日に戻す
            </button>
          </div>
        </div>

        <!-- 金額入力＆クイック加算 -->
        <div class="relative mb-2.5">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-lg">¥</span>
          <input type="number" id="expenseAmount" inputmode="numeric" placeholder="0"
            class="w-full pl-8 pr-16 py-3 bg-slate-50 border border-slate-200 rounded-xl text-2xl font-extrabold font-num text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
          <button onclick="clearAmountInput()" type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 hover:text-slate-600 px-2 py-1">
            クリア
          </button>
        </div>

        <!-- ワンタップ加算ボタン -->
        <div class="grid grid-cols-4 gap-1.5 mb-3">
          <button type="button" onclick="addQuickAmount(100)" class="py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-lg text-xs font-bold font-num text-slate-700 transition">+100</button>
          <button type="button" onclick="addQuickAmount(500)" class="py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-lg text-xs font-bold font-num text-slate-700 transition">+500</button>
          <button type="button" onclick="addQuickAmount(1000)" class="py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-lg text-xs font-bold font-num text-slate-700 transition">+1,000</button>
          <button type="button" onclick="addQuickAmount(3000)" class="py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-lg text-xs font-bold font-num text-slate-700 transition">+3,000</button>
        </div>

        <!-- カテゴリ選択 -->
        <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-2 mb-2.5" id="categoryContainer">
          <!-- JSで生成 -->
