<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Pocket - 週間予算＆お小遣い管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans JP & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            num: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out forwards',
            'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* カスタムスクロールバーと数値入力スピナー非表示 */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-800 pb-16">

  <!-- トースト通知エリア -->
  <div id="toast-container" class="fixed top-4 right-4 left-4 sm:left-auto sm:w-80 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ヘッダー -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-sm shadow-indigo-200">
          <i data-lucide="wallet" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg tracking-tight text-slate-900 leading-none">Weekly Pocket</h1>
          <p id="header-week-range" class="text-[11px] sm:text-xs text-slate-500 font-medium mt-1">読み込み中...</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- 過去履歴ボタン -->
        <button id="open-archive-btn" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200/80 active:scale-95 transition-all">
          <i data-lucide="history" class="w-4 h-4 text-slate-500"></i>
          <span class="hidden sm:inline">過去の記録</span>
          <span id="archive-count-badge" class="bg-white text-slate-700 px-1.5 py-0.5 rounded-md text-[11px] shadow-xs">0</span>
        </button>

        <!-- 新しい週を始めるボタン -->
        <button id="open-reset-modal-btn" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 active:scale-95 transition-all">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          <span>週を締める</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 pt-5 space-y-6">

    <!-- 1. 残金ダッシュボードカード -->
    <section class="bg-white rounded-3xl p-5 sm:p-7 shadow-sm border border-slate-200/70 relative overflow-hidden">
      <!-- 背景装飾 -->
      <div id="dashboard-glow" class="absolute -right-12 -top-12 w-48 h-48 rounded-full bg-emerald-400/10 blur-2xl pointer-events-none transition-colors duration-500"></div>

      <!-- 上部：今週の予算設定バー -->
      <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center gap-1 text-xs font-bold uppercase tracking-wider text-slate-400 bg-slate-100 px-2.5 py-1 rounded-lg">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
            <span id="week-period-label">今週の予算</span>
          </span>
        </div>

        <!-- 予算表示 / 編集切り替え -->
        <div id="budget-display-mode" class="flex items-center gap-2">
          <span class="text-xs text-slate-500 font-medium">設定予算:</span>
          <button id="edit-budget-btn" type="button" class="group inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-200/80 hover:border-indigo-200 transition-all">
            <span id="display-budget-amount" class="font-num font-bold text-sm sm:text-base text-slate-800 group-hover:text-indigo-700 tabular-nums">¥10,000</span>
            <i data-lucide="pencil" class="w-3.5 h-3.5 text-slate-400 group-hover:text-indigo-600"></i>
          </button>
        </div>

        <!-- 予算インライン編集フォーム -->
        <form id="budget-edit-form" class="hidden flex items-center gap-1.5 w-full sm:w-auto justify-end mt-1 sm:mt-0">
          <div class="relative flex-1 sm:w-36">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-num font-bold text-sm">¥</span>
            <input id="budget-input" type="number" min="0" step="100" required class="w-full pl-7 pr-3 py-1.5 text-sm font-num font-bold bg-white border-2 border-indigo-500 rounded-xl focus:outline-none text-right tabular-nums" placeholder="10000">
          </div>
          <button type="submit" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-xs transition-colors">保存</button>
          <button id="cancel-budget-btn" type="button" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl transition-colors">取消</button>
        </form>
      </div>

      <!-- 中央：残金メイン表示 -->
      <div class="py-5 sm:py-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-bold text-slate-500">今週の残り予算</span>
            <span id="status-badge" class="px-2 py-0.5 text-[11px] font-bold rounded-full bg-emerald-100 text-emerald-700 transition-colors">余裕あり</span>
          </div>
          <div class="flex items-baseline gap-1">
            <span id="remaining-sign" class="font-num text-2xl sm:text-3xl font-extrabold text-slate-900">¥</span>
            <span id="remaining-amount" class="font-num text-4xl sm:text-5xl font-extrabold tracking-tight text-slate-900 tabular-nums transition-colors">10,000</span>
          </div>
        </div>

        <!-- 1日あたりの目安カード -->
        <div class="bg-slate-50/90 border border-slate-200/70 rounded-2xl px-4 py-3 sm:text-right flex sm:flex-col items-center sm:items-end justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-slate-500">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500"></i>
            <span id="days-left-label">残り7日間の目安</span>
          </div>
          <div class="mt-0.5">
            <span class="text-xs text-slate-500 font-medium">1日あたり</span>
            <span id="daily-allowance" class="font-num text-lg sm:text-xl font-extrabold text-indigo-600 ml-1 tabular-nums">¥1,428</span>
          </div>
        </div>
      </div>

      <!-- 下部：プログレスバー＆使用済みサマリー -->
      <div class="space-y-2.5">
        <div class="w-full h-3.5 bg-slate-100 rounded-full overflow-hidden p-0.5 border border-slate-200/50">
          <div id="budget-progress-bar" class="h-full rounded-full bg-emerald-500 transition-all duration-500 ease-out" style="width: 100%;"></div>
        </div>
        <div class="flex items-center justify-between text-xs sm:text-sm font-medium">
          <div class="flex items-center gap-1.5 text-slate-600">
            <span class="w-2 h-2 rounded-full bg-slate-400"></span>
            <span>使用済み: <strong id="total-spent-amount" class="font-num font-bold text-slate-800 tabular-nums">¥0</strong></span>
          </div>
          <span id="remaining-percentage" class="font-num font-bold text-slate-500 tabular-nums">残り 100%</span>
        </div>
      </div>
    </section>

    <!-- 2. 支出の簡単登録フォーム -->
    <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/70">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <span class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
          </span>
          使った金額を登録
        </h2>
        <span class="text-xs text-slate-400 font-medium">Enterキーでも即登録</span>
      </div>

      <form id="expense-form" class="space-y-4">
        <!-- 金額入力とクイック加算ボタン -->
        <div>
          <label for="expense-amount" class="block text-xs font-bold text-slate-500 mb-1.5">金額（円）<span class="text-rose-500 ml-0.5">*</span></label>
          <div class="flex flex-col sm:flex-row gap-2.5">
            <div class="relative flex-1">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 font-num font-extrabold text-xl text-slate-400">¥</span>
              <input id="expense-amount" type="number" min="1" step="1" required placeholder="0" class="w-full pl-10 pr-12 py-3 bg-slate-50 focus:bg-white border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 rounded-2xl font-num text-2xl font-extrabold text-slate-900 tabular-nums transition-all outline-none">
              <button id="clear-amount-btn" type="button" title="金額をクリア" class="hidden absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-200/60 transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- クイック金額ボタン -->
            <div class="grid grid-cols-4 sm:flex gap-1.5">
              <button type="button" data-quick-add="100" class="quick-add-btn px-3 py-2.5 sm:py-0 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 font-num font-bold text-xs sm:text-sm border border-transparent hover:border-indigo-200 active:scale-95 transition-all">+100</button>
              <button type="button" data-quick-add="500" class="quick-add-btn px-3 py-2.5 sm:py-0 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 font-num font-bold text-xs sm:text-sm border border-transparent hover:border-indigo-200 active:scale-95 transition-all">+500</button>
              <button type="button" data-quick-add="1000" class="quick-add-btn px-3 py-2.5 sm:py-0 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 font-num font-bold text-xs sm:text-sm border border-transparent hover:border-indigo-200 active:scale-95 transition-all">+1,000</button>
              <button type="button" data-quick-add="3000" class="quick-add-btn px-3 py-2.5 sm:py-0 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 font-num font-bold text-xs sm:text-sm border border-transparent hover:border-indigo-200 active:scale-95 transition-all">+3,000</button>
            </div>
          </div>
        </div>

        <!-- カテゴリ選択（タップしやすいチップUI） -->
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1.5">カテゴリ</label>
          <div id="category-selector" class="grid grid-cols-3 sm:grid-cols-6 gap-2">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <!-- メモ ＆ 日付 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <label for="expense-memo" class="block text-xs font-bold text-slate-500 mb-1.5">メモ / 内容（任意）</label>
            <div class="relative">
              <i data-lucide="file-text" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input id="expense-memo" type="text" maxlength="40" placeholder="例：ランチ、コンビニ、カフェなど" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 focus:bg-white border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 rounded-xl text-sm font-medium text-slate-800 transition-all outline-none">
            </div>
          </div>

          <div>
            <label for="expense-date" class="block text-xs font-bold text-slate-500 mb-1.5">日付</label>
            <input id="expense-date" type="date" required class="w-full px-3.5 py-2.5 bg-slate-50 focus:bg-white border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 rounded-xl text-sm font-num font-semibold text-slate-800 transition-all outline-none">
          </div>
        </div>

        <!-- 登録ボタン -->
        <button type="submit" class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-sm sm:text-base rounded-2xl shadow-md shadow-indigo-200 flex items-center justify-center gap-2 transition-all">
          <i data-lucide="check" class="w-5 h-5"></i>
          <span>支出を登録する</span>
        </button>
      </form>
    </section>

    <!-- 3. カテゴリ別内訳 ＆ 支出履歴 -->
    <div class="grid grid-cols-1 gap-6">
      <!-- カテゴリ別内訳バー -->
      <section id="category-breakdown-section" class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/70 hidden">
        <h2 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-600"></i>
          カテゴリ別の支出バランス
        </h2>
        <!-- 積み上げ横棒グラフ -->
        <div id="category-stacked-bar" class="w-full h-3 rounded-full bg-slate-100 overflow-hidden flex gap-0.5 mb-4"></div>
        <!-- カテゴリ凡例グリッド -->
        <div id="category-breakdown-list" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
      </section>

      <!-- 今週の支出リスト -->
      <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/70">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center">
              <i data-lucide="receipt" class="w-4 h-4"></i>
            </span>
            今週の支出履歴
            <span id="expense-count-badge" class="text-xs font-num font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">0件</span>
          </h2>
        </div>

        <!-- リストコンテナ -->
        <div id="expense-list" class="divide-y divide-slate-100">
          <!-- JSで描画 -->
        </div>

        <!-- 空状態 -->
        <div id="empty-expense-state" class="py-10 text-center">
          <div class="w-14 h-14 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center mx-auto mb-3 text-slate-300">
            <i data-lucide="sparkles" class="w-7 h-7"></i>
          </div>
          <p class="text-sm font-bold text-slate-600">まだ支出の登録がありません</p>
          <p class="text-xs text-slate-400 mt-1">上のフォームから使った金額を記録しましょう</p>
        </div>
      </section>
    </div>
  </main>

  <!-- モーダル1: 新しい週を始める（今週を締め切ってリセット） -->
  <div id="reset-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs animate-fade-in">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-slide-up">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
            <i data-lucide="calendar-check" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-bold text-base text-slate-900">今週を締め切ってリセット</h3>
            <p class="text-xs text-slate-500">現在の記録をアーカイブに保存します</p>
          </div>
        </div>
        <button type="button" data-close-modal="reset-modal" class="p-2 text-slate-400 hover:text-slate-600 rounded-xl hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 今週のサマリープレビュー -->
      <div class="bg-slate-50 rounded-2xl p-4 mb-4 border border-slate-200/70 space-y-2 text-sm">
        <div class="flex justify-between text-slate-500">
          <span>対象期間</span>
          <span id="modal-current-period" class="font-bold text-slate-700">-</span>
        </div>
        <div class="flex justify-between text-slate-500">
          <span>設定予算</span>
          <span id="modal-current-budget" class="font-num font-bold text-slate-700 tabular-nums">¥0</span>
        </div>
        <div class="flex justify-between text-slate-500">
          <span>合計支出</span>
          <span id="modal-current-spent" class="font-num font-bold text-slate-700 tabular-nums">¥0</span>
        </div>
        <div class="pt-2 border-t border-slate-200/80 flex justify-between items-baseline">
          <span class="font-bold text-slate-700">最終残金</span>
          <span id="modal-current-remaining" class="font-num text-lg font-extrabold text-emerald-600 tabular-nums">¥0</span>
        </div>
      </div>

      <form id="new-week-form" class="space-y-4">
        <div>
          <label for="next-week-budget" class="block text-xs font-bold text-slate-600 mb-1.5">新しい週の予算（円）</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 font-num font-bold text-slate-400">¥</span>
            <input id="next-week-budget" type="number" min="0" step="100" required class="w-full pl-8 pr-4 py-2.5 bg-white border border-slate-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 rounded-xl font-num font-bold text-base text-slate-900 tabular-nums outline-none">
          </div>
          <label class="inline-flex items-center gap-2 mt-2.5 cursor-pointer select-none">
            <input id="carry-over-checkbox" type="checkbox" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
            <span class="text-xs font-medium text-slate-600">今週の残金（プラスの場合）を次週に繰り越す</span>
          </label>
        </div>

        <div class="flex gap-2.5 pt-2">
          <button type="button" data-close-modal="reset-modal" class="flex-1 py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition-colors">キャンセル</button>
          <button type="submit" class="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-sm transition-colors">保存して新週開始</button>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダル2: 過去の週の履歴アーカイブ -->
  <div id="archive-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs animate-fade-in">
    <div class="bg-white rounded-3xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-100 animate-slide-up">
      <div class="p-6 pb-4 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-slate-100 text-slate-700 flex items-center justify-center">
            <i data-lucide="archive" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-bold text-base text-slate-900">過去の週間記録</h3>
            <p class="text-xs text-slate-500">締め切った週の予算と支出実績</p>
          </div>
        </div>
        <button type="button" data-close-modal="archive-modal" class="p-2 text-slate-400 hover:text-slate-600 rounded-xl hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="archive-list-container" class="p-6 overflow-y-auto space-y-3 flex-1">
        <!-- JSで動的描画 -->
      </div>
    </div>
  </div>

  <script>
    /**
     * Weekly Pocket - 週間予算＆お小遣い管理アプリ
     * すべての状態を localStorage に自動保存し、リアルタイムに残金と日割り目安を計算します。
     */
    (function () {
      'use strict';

      // ==========================================
      // 1. 定数・カテゴリ定義
      // ==========================================
      const STORAGE_KEY = 'weekly_pocket_data_v1';

      const CATEGORIES = [
        { id: 'food', name: '食費', icon: 'utensils', color: 'bg-orange-500', badgeBg: 'bg-orange-50', badgeText: 'text-orange-600', border: 'border-orange-200' },
        { id: 'cafe', name: 'カフェ・間食', icon: 'coffee', color: 'bg-amber-500', badgeBg: 'bg-amber-50', badgeText: 'text-amber-700', border: 'border-amber-200' },
        { id: 'daily', name: '日用品', icon: 'shopping-bag', color: 'bg-teal-500', badgeBg: 'bg-teal-50', badgeText: 'text-teal-700', border: 'border-teal-200' },
        { id: 'transport', name: '交通費', icon: 'train-front', color: 'bg-sky-500', badgeBg: 'bg-sky-50', badgeText: 'text-sky-700', border: 'border-sky-200' },
        { id: 'hobby', name: '娯楽・趣味', icon: 'gamepad-2', color: 'bg-violet-500', badgeBg: 'bg-violet-50', badgeText: 'text-violet-700', border: 'border-violet-200' },
        { id: 'other', name: 'その他', icon: 'more-horizontal', color: 'bg-slate-500', badgeBg: 'bg-slate-100', badgeText: 'text-slate-700', border: 'border-slate-200' }
      ];

      // ==========================================
      // 2. 日付ユーティリティ（月曜始まり〜日曜終わり基準）
      // ==========================================
      function getTodayStr() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function getCurrentWeekBounds() {
        const now = new Date();
        const day = now.getDay(); // 0(日) - 6(土)
        // 月曜を週の開始日とする
        const diffToMonday = day === 0 ? -6 : 1 - day;
        const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday);
        const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);

        const formatShort = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
        const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
        const label = `${formatShort(monday)}(${weekdays[monday.getDay()]}) 〜 ${formatShort(sunday)}(${weekdays[sunday.getDay()]})`;

        // 今日を含めた今週の残り日数（月曜=7日, 日曜=1日）
        const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffDays = Math.round((sunday - todayMidnight) / (1000 * 60 * 60 * 24)) + 1;
        const remainingDays = Math.max(1, Math.min(7, diffDays));

        return {
          startStr: `${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, '0')}-${String(monday.getDate()).padStart(2, '0')}`,
          endStr: `${sunday.getFullYear()}-${String(sunday.getMonth() + 1).padStart(2, '0')}-${String(sunday.getDate()).padStart(2, '0')}`,
          label,
          remainingDays
        };
      }

      function formatDisplayDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
        return `${Number(parts[1])}/${Number(parts[2])}(${weekdays[d.getDay()]})`;
      }

      function formatYen(amount) {
        return '¥' + Math.round(amount).toLocaleString('ja-JP');
      }

      // ==========================================
      // 3. アプリケーション状態管理
      // ==========================================
      let state = {
        weeklyBudget: 10000,
        weekLabel: getCurrentWeekBounds().label,
        expenses: [], // { id, amount, category, memo, date, createdAt }
        archives: []  // { id, period, budget, spent, remaining, count, closedAt }
      };

      let selectedCategoryId = 'food';

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            state = {
              weeklyBudget: typeof parsed.weeklyBudget === 'number' ? parsed.weeklyBudget : 10000,
              weekLabel: parsed.weekLabel || getCurrentWeekBounds().label,
              expenses: Array.isArray(parsed.expenses) ? parsed.expenses : [],
              archives: Array.isArray(parsed.archives) ? parsed.archives : []
            };
          } else {
            // 初回訪問時は現在の週ラベルを設定して保存
            state.weekLabel = getCurrentWeekBounds().label;
            saveState();
          }
        } catch (e) {
          console.error('データの読み込みに失敗しました:', e);
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.error('データの保存に失敗しました:', e);
          showToast('データの保存に失敗しました', 'error');
        }
      }

      // ==========================================
      // 4. トースト通知システム（alert()代替）
      // ==========================================
      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');

        const styles = {
          success: 'bg-slate-900 text-white border-slate-800',
          info: 'bg-indigo-600 text-white border-indigo-500',
          error: 'bg-rose-600 text-white border-rose-500'
        };

        const icons = {
          success: 'check-circle-2',
          info: 'info',
          error: 'alert-circle'
        };

        toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-lg border text-xs sm:text-sm font-bold animate-slide-up ${styles[type] || styles.success}`;
        toast.innerHTML = `
          <i data-lucide="${icons[type] || icons.success}" class="w-4 h-4 shrink-0"></i>
          <span>${escapeHtml(message)}</span>
        `;

        container.appendChild(toast);
        lucide.createIcons({ root: toast });

        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-8px)';
          toast.style.transition = 'all 0.25s ease';
          setTimeout(() => toast.remove(), 250);
        }, 2600);
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // ==========================================
      // 5. UIレンダリング関数群
      // ==========================================
      function renderAll() {
        renderHeaderAndDashboard();
        renderCategorySelector();
        renderCategoryBreakdown();
        renderExpenseList();
        renderArchiveCount();
        lucide.createIcons();
      }

      function renderHeaderAndDashboard() {
        const weekInfo = getCurrentWeekBounds();
        document.getElementById('header-week-range').textContent = state.weekLabel;
        document.getElementById('week-period-label').textContent = state.weekLabel;
        document.getElementById('display-budget-amount').textContent = formatYen(state.weeklyBudget);

        const totalSpent = state.expenses.reduce((sum, item) => sum + item.amount, 0);
        const remaining = state.weeklyBudget - totalSpent;
        const ratio = state.weeklyBudget > 0 ? (remaining / state.weeklyBudget) * 100 : (remaining < 0 ? -100 : 0);
        const clampedPercent = Math.max(0, Math.min(100, ratio));

        // 残金数値と符号
        const signEl = document.getElementById('remaining-sign');
        const amountEl = document.getElementById('remaining-amount');
        if (remaining < 0) {
          signEl.textContent = '-¥';
          amountEl.textContent = Math.abs(Math.round(remaining)).toLocaleString('ja-JP');
        } else {
          signEl.textContent = '¥';
          amountEl.textContent = Math.round(remaining).toLocaleString('ja-JP');
        }

        // ステータスに応じたカラーテーマ変更
        const barEl = document.getElementById('budget-progress-bar');
        const badgeEl = document.getElementById('status-badge');
        const glowEl = document.getElementById('dashboard-glow');

        // クラスリセット
        barEl.className = 'h-full rounded-full transition-all duration-500 ease-out';
        badgeEl.className = 'px-2 py-0.5 text-[11px] font-bold rounded-full transition-colors';
        amountEl.className = 'font-num text-4xl sm:text-5xl font-extrabold tracking-tight tabular-nums transition-colors';
        signEl.className = 'font-num text-2xl sm:text-3xl font-extrabold transition-colors';

        if (remaining < 0) {
          // 予算超過（赤）
          barEl.classList.add('bg-rose-500');
          barEl.style.width = '100%';
          badgeEl.classList.add('bg-rose-100', 'text-rose-700');
          badgeEl.textContent = '予算オーバー';
          amountEl.classList.add('text-rose-600');
          signEl.classList.add('text-rose-600');
          glowEl.className = 'absolute -right-12 -top-12 w-48 h-48 rounded-full bg-rose-400/15 blur-2xl pointer-events-none transition-colors duration-500';
        } else if (ratio <= 25) {
          // 残りわずか（黄色・アンバー）
          barEl.classList.add('bg-amber-500');
          barEl.style.width = `${clampedPercent}%`;
          badgeEl.classList.add('bg-amber-100', 'text-amber-800');
          badgeEl.textContent = '残りわずか';
          amountEl.classList.add('text-amber-600');
          signEl.classList.add('text-amber-600');
          glowEl.className = 'absolute -right-12 -top-12 w-48 h-48 rounded-full bg-amber-400/15 blur-2xl pointer-events-none transition-colors duration-500';
        } else {
          // 余裕あり（エメラルドグリーン）
          barEl.classList.add('bg-emerald-500');
          barEl.style.width = `${clampedPercent}%`;
          badgeEl.classList.add('bg-emerald-100', 'text-emerald-700');
          badgeEl.textContent = ratio > 60 ? '順調ペース' : '適正ペース';
          amountEl.classList.add('text-slate-900');
          signEl.classList.add('text-slate-900');
          glowEl.className = 'absolute -right-12 -top-12 w-48 h-48 rounded-full bg-emerald-400/15 blur-2xl pointer-events-none transition-colors duration-500';
        }

        // 1日あたりの目安計算
        const daysLeft = weekInfo.remainingDays;
        document.getElementById('days-left-label').textContent = `残り${daysLeft}日間の目安`;
        const dailyAllowanceEl = document.getElementById('daily-allowance');
        if (remaining <= 0) {
          dailyAllowanceEl.textContent = '¥0';
          dailyAllowanceEl.className = 'font-num text-lg sm:text-xl font-extrabold text-rose-500 ml-1 tabular-nums';
        } else {
          const perDay = Math.floor(remaining / daysLeft);
          dailyAllowanceEl.textContent = formatYen(perDay);
          dailyAllowanceEl.className = 'font-num text-lg sm:text-xl font-extrabold text-indigo-600 ml-1 tabular-nums';
        }

        // 使用済み合計と残率
        document.getElementById('total-spent-amount').textContent = formatYen(totalSpent);
        const displayPercent = remaining < 0 ? 0 : Math.round(ratio);
        document.getElementById('remaining-percentage').textContent = remaining < 0
          ? `${formatYen(Math.abs(remaining))} 超過`
          : `残り ${displayPercent}%`;
      }

      function renderCategorySelector() {
        const container = document.getElementById('category-selector');
        container.innerHTML = CATEGORIES.map(cat => {
          const isSelected = cat.id === selectedCategoryId;
          const activeClass = isSelected
            ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm shadow-indigo-200 scale-[1.02]'
            : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200/80';

          return `
            <button type="button" data-select-cat="${cat.id}" class="flex flex-col items-center justify-center gap-1 py-2.5 px-2 rounded-2xl border text-xs font-bold transition-all active:scale-95 ${activeClass}">
              <i data-lucide="${cat.icon}" class="w-4 h-4"></i>
              <span class="truncate max-w-full">${cat.name}</span>
            </button>
          `;
        }).join('');
      }

      function renderCategoryBreakdown() {
        const section = document.getElementById('category-breakdown-section');
        const totalSpent = state.expenses.reduce((sum, item) => sum + item.amount, 0);

        if (totalSpent <= 0 || state.expenses.length === 0) {
          section.classList.add('hidden');
          return;
        }

        section.classList.remove('hidden');

        // カテゴリ別集計
        const totalsByCat = {};
        CATEGORIES.forEach(c => totalsByCat[c.id] = 0);
        state.expenses.forEach(exp => {
          totalsByCat[exp.category] = (totalsByCat[exp.category] || 0) + exp.amount;
        });

        const activeCats = CATEGORIES
          .map(cat => ({ ...cat, amount: totalsByCat[cat.id] || 0 }))
          .filter(cat => cat.amount > 0)
          .sort((a, b) => b.amount - a.amount);

        // 積み上げバー
        const stackedBar = document.getElementById('category-stacked-bar');
        stackedBar.innerHTML = activeCats.map(cat => {
          const pct = (cat.amount / totalSpent) * 100;
          return `<div class="${cat.color} h-full transition-all duration-500" style="width: ${pct}%" title="${cat.name}: ${formatYen(cat.amount)}"></div>`;
        }).join('');

        // 凡例カード
        const listEl = document.getElementById('category-breakdown-list');
        listEl.innerHTML = activeCats.map(cat => {
          const pct = Math.round((cat.amount / totalSpent) * 100);
          return `
            <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-2.5 h-2.5 rounded-full shrink-0 ${cat.color}"></span>
                <span class="text-xs font-bold text-slate-700 truncate">${cat.name}</span>
              </div>
              <div class="text-right shrink-0 ml-2">
                <span class="font-num text-xs font-extrabold text-slate-900 tabular-nums">${formatYen(cat.amount)}</span>
                <span class="text-[10px] text-slate-400 font-num ml-0.5">(${pct}%)</span>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderExpenseList() {
        const listEl = document.getElementById('expense-list');
        const emptyEl = document.getElementById('empty-expense-state');
        const badgeEl = document.getElementById('expense-count-badge');

        badgeEl.textContent = `${state.expenses.length}件`;

        if (state.expenses.length === 0) {
          listEl.innerHTML = '';
          emptyEl.classList.remove('hidden');
          return;
        }

        emptyEl.classList.add('hidden');

        // 日付の新しい順、同じ日付なら登録順（新しい順）にソート
        const sorted = [...state.expenses].sort((a, b) => {
          if (a.date !== b.date) return b.date.localeCompare(a.date);
          return (b.createdAt || 0) - (a.createdAt || 0);
        });

        listEl.innerHTML = sorted.map(item => {
          const cat = CATEGORIES.find(c => c.id === item.category) || CATEGORIES[CATEGORIES.length - 1];
          const displayMemo = item.memo && item.memo.trim() !== '' ? escapeHtml(item.memo) : cat.name;

          return `
            <div class="py-3.5 first:pt-1 last:pb-1 flex items-center justify-between gap-3 group animate-fade-in">
              <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-2xl ${cat.badgeBg} ${cat.badgeText} border ${cat.border} flex items-center justify-center shrink-0">
                  <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0">
                  <p class="text-sm font-bold text-slate-800 truncate">${displayMemo}</p>
                  <div class="flex items-center gap-2 mt-0.5 text-xs text-slate-400 font-medium">
                    <span class="font-num">${formatDisplayDate(item.date)}</span>
                    <span>•</span>
                    <span>${cat.name}</span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2.5 shrink-0">
                <span class="font-num text-base font-extrabold text-slate-900 tabular-nums">-${formatYen(item.amount)}</span>
                <button type="button" data-delete-expense="${item.id}" title="この支出を削除" class="p-2 rounded-xl text-slate-300 hover:text-rose-600 hover:bg-rose-50 active:scale-90 transition-all">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderArchiveCount() {
        document.getElementById('archive-count-badge').textContent = state.archives.length;
      }

      function renderArchiveList() {
        const container = document.getElementById('archive-list-container');
        if (state.archives.length === 0) {
          container.innerHTML = `
            <div class="py-12 text-center">
              <div class="w-12 h-12 rounded-2xl bg-slate-50 text-slate-300 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="folder-open" class="w-6 h-6"></i>
              </div>
              <p class="text-sm font-bold text-slate-600">過去の週間記録はまだありません</p>
              <p class="text-xs text-slate-400 mt-1">右上の「週を締める」から今週の結果を保存できます</p>
            </div>
          `;
          lucide.createIcons({ root: container });
          return;
        }

        container.innerHTML = state.archives.map(arc => {
          const isPositive = arc.remaining >= 0;
          const remColor = isPositive ? 'text-emerald-600' : 'text-rose-600';
          const badge = isPositive
            ? '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">予算内達成</span>'
            : '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-rose-50 text-rose-700 border border-rose-200">予算超過</span>';

          return `
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                  <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
                  ${escapeHtml(arc.period)}
                </span>
                <div class="flex items-center gap-2">
                  ${badge}
                  <button type="button" data-delete-archive="${arc.id}" title="履歴を削除" class="p-1 text-slate-400 hover:text-rose-600 rounded-lg">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-2 pt-1 text-xs">
                <div class="bg-white p-2 rounded-xl border border-slate-100">
                  <span class="text-slate-400 block text-[10px]">設定予算</span>
                  <span class="font-num font-bold text-slate-800 tabular-nums">${formatYen(arc.budget)}</span>
                </div>
                <div class="bg-white p-2 rounded-xl border border-slate-100">
                  <span class="text-slate-400 block text-[10px]">支出合計 (${arc.count}件)</span>
                  <span class="font-num font-bold text-slate-800 tabular-nums">${formatYen(arc.spent)}</span>
                </div>
                <div class="bg-white p-2 rounded-xl border border-slate-100">
                  <span class="text-slate-400 block text-[10px]">最終残金</span>
                  <span class="font-num font-extrabold ${remColor} tabular-nums">${arc.remaining < 0 ? '-' : ''}${formatYen(Math.abs(arc.remaining))}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        lucide.createIcons({ root: container });
      }

      // ==========================================
      // 6. イベントリスナー設定
      // ==========================================
      function setupEventListeners() {
        // 予算編集モード切り替え
        const displayMode = document.getElementById('budget-display-mode');
        const editForm = document.getElementById('budget-edit-form');
        const budgetInput = document.getElementById('budget-input');

        document.getElementById('edit-budget-btn').addEventListener('click', () => {
          budgetInput.value = state.weeklyBudget;
          displayMode.classList.add('hidden');
          editForm.classList.remove('hidden');
          budgetInput.focus();
          budgetInput.select();
        });

        document.getElementById('cancel-budget-btn').addEventListener('click', () => {
          editForm.classList.add('hidden');
          displayMode.classList.remove('hidden');
        });

        editForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const val = parseInt(budgetInput.value, 10);
          if (isNaN(val) || val < 0) {
            showToast('0円以上の正しい金額を入力してください', 'error');
            return;
          }
          state.weeklyBudget = val;
          saveState();
          editForm.classList.add('hidden');
          displayMode.classList.remove('hidden');
          renderAll();
          showToast(`今週の予算を ${formatYen(val)} に設定しました`, 'info');
        });

        // 金額入力＆クリアボタン制御
        const amountInput = document.getElementById('expense-amount');
        const clearAmountBtn = document.getElementById('clear-amount-btn');

        const updateClearBtnVisibility = () => {
          if (amountInput.value && Number(amountInput.value) > 0) {
            clearAmountBtn.classList.remove('hidden');
          } else {
            clearAmountBtn.classList.add('hidden');
          }
        };

        amountInput.addEventListener('input', updateClearBtnVisibility);

        clearAmountBtn.addEventListener('click', () => {
          amountInput.value = '';
          updateClearBtnVisibility();
          amountInput.focus();
        });

        // クイック加算ボタン (+100, +500, +1000, +3000)
        document.querySelectorAll('.quick-add-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const addVal = parseInt(btn.getAttribute('data-quick-add'), 10);
            const current = parseInt(amountInput.value, 10) || 0;
            amountInput.value = current + addVal;
            updateClearBtnVisibility();
          });
        });

        // カテゴリ選択（イベント委譲）
        document.getElementById('category-selector').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-select-cat]');
          if (!btn) return;
          selectedCategoryId = btn.getAttribute('data-select-cat');
          renderCategorySelector();
          lucide.createIcons({ root: document.getElementById('category-selector') });
        });

        // 支出登録フォーム送信
        const expenseForm = document.getElementById('expense-form');
        const memoInput = document.getElementById('expense-memo');
        const dateInput = document.getElementById('expense-date');
        dateInput.value = getTodayStr();

        expenseForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const amount = parseInt(amountInput.value, 10);
          if (isNaN(amount) || amount <= 0) {
            showToast('1円以上の金額を入力してください', 'error');
            amountInput.focus();
            return;
          }

          const newExpense = {
            id: 'exp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            amount: amount,
            category: selectedCategoryId,
            memo: memoInput.value.trim(),
            date: dateInput.value || getTodayStr(),
            createdAt: Date.now()
          };

          state.expenses.unshift(newExpense);
          saveState();

          // フォームリセット（日付とカテゴリは連続入力しやすいよう維持）
          amountInput.value = '';
          memoInput.value = '';
          updateClearBtnVisibility();

          renderAll();
          showToast(`${formatYen(amount)} の支出を登録しました`);
        });

        // 支出アイテム削除（イベント委譲）
        document.getElementById('expense-list').addEventListener('click', (e) => {
          const delBtn = e.target.closest('[data-delete-expense]');
          if (!delBtn) return;
          const id = delBtn.getAttribute('data-delete-expense');
          const target = state.expenses.find(item => item.id === id);
          if (!target) return;

          state.expenses = state.expenses.filter(item => item.id !== id);
          saveState();
          renderAll();
          showToast(`${formatYen(target.amount)} の記録を削除しました`, 'info');
        });

        // モーダル開閉共通処理
        const openModal = (modalId) => {
          const modal = document.getElementById(modalId);
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        };

        const closeModal = (modalId) => {
          const modal = document.getElementById(modalId);
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        };

        document.querySelectorAll('[data-close-modal]').forEach(btn => {
          btn.addEventListener('click', () => {
            closeModal(btn.getAttribute('data-close-modal'));
          });
        });

        // 背景クリックでモーダルを閉じる
        ['reset-modal', 'archive-modal'].forEach(modalId => {
          const modal = document.getElementById(modalId);
          modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal(modalId);
          });
        });

        // 「週を締める」モーダルを開く
        document.getElementById('open-reset-modal-btn').addEventListener('click', () => {
          const totalSpent = state.expenses.reduce((sum, item) => sum + item.amount, 0);
          const remaining = state.weeklyBudget - totalSpent;

          document.getElementById('modal-current-period').textContent = state.weekLabel;
          document.getElementById('modal-current-budget').textContent = formatYen(state.weeklyBudget);
          document.getElementById('modal-current-spent').textContent = formatYen(totalSpent);

          const remEl = document.getElementById('modal-current-remaining');
          remEl.textContent = (remaining < 0 ? '-' : '') + formatYen(Math.abs(remaining));
          remEl.className = `font-num text-lg font-extrabold tabular-nums ${remaining >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;

          document.getElementById('next-week-budget').value = state.weeklyBudget;
          const carryCheckbox = document.getElementById('carry-over-checkbox');
          carryCheckbox.checked = false;
          carryCheckbox.disabled = remaining <= 0;

          openModal('reset-modal');
        });

        // 新しい週を始めるフォーム送信
        document.getElementById('new-week-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const baseNextBudget = parseInt(document.getElementById('next-week-budget').value, 10);
          if (isNaN(baseNextBudget) || baseNextBudget < 0) {
            showToast('正しい予算額を入力してください', 'error');
            return;
          }

          const totalSpent = state.expenses.reduce((sum, item) => sum + item.amount, 0);
          const remaining = state.weeklyBudget - totalSpent;
          const carryOver = document.getElementById('carry-over-checkbox').checked && remaining > 0 ? remaining : 0;

          // 現在の週をアーカイブに追加
          state.archives.unshift({
            id: 'arc_' + Date.now(),
            period: state.weekLabel,
            budget: state.weeklyBudget,
            spent: totalSpent,
            remaining: remaining,
            count: state.expenses.length,
            closedAt: Date.now()
          });

          // 新しい週へリセット
          state.weeklyBudget = baseNextBudget + carryOver;
          state.weekLabel = getCurrentWeekBounds().label;
          state.expenses = [];
          saveState();

          closeModal('reset-modal');
          renderAll();
          showToast(carryOver > 0
            ? `残金 ${formatYen(carryOver)} を繰り越して新しい週を開始しました！`
            : '今週の記録を保存し、新しい週を開始しました！');
        });

        // 「過去の記録」モーダルを開く
        document.getElementById('open-archive-btn').addEventListener('click', () => {
          renderArchiveList();
          openModal('archive-modal');
        });

        // アーカイブ個別削除
        document.getElementById('archive-list-container').addEventListener('click', (e) => {
          const delBtn = e.target.closest('[data-delete-archive]');
          if (!delBtn) return;
          const id = delBtn.getAttribute('data-delete-archive');
          state.archives = state.archives.filter(a => a.id !== id);
          saveState();
          renderArchiveList();
          renderArchiveCount();
          showToast('過去の記録を1件削除しました', 'info');
        });
      }

      // ==========================================
      // 7. 初期化実行
      // ==========================================
      document.addEventListener('DOMContentLoaded', () => {
        loadState();
        setupEventListeners();
        renderAll();
      });
    })();
  </script>
</body>
</html>
